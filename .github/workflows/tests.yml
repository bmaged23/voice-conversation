name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies for offline tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.txt
          python -m pip check
      - name: Run offline tests
        run: python -m pytest -q
