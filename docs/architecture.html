<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voca · Animated architecture</title>
<style>
:root{font-family:system-ui,sans-serif;color:#20382c;background:#f4f7f0}body{margin:0;padding:35px}main{max-width:1400px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:30px;letter-spacing:-1.1px;margin:0 0 8px}p{font-size:13px;color:#768774;line-height:1.7}button{border:1px solid #ccd9c3;border-radius:8px;background:#fff;color:#386444;padding:10px 18px;cursor:pointer}svg{width:100%;height:auto;display:block;margin:24px 0;border:1px solid #dbe5d5;border-radius:18px;background:#fcfdf9}.edge{fill:none;stroke:#b3c6a9;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#b89d78;stroke-dasharray:6 5}.node rect{fill:#fff;stroke:#dbe5d5;stroke-width:1.5}.node.active rect{stroke:#5d9867;fill:#edf6e7;stroke-width:2.5}.node text{fill:#294c36}.title{font-size:16px;font-weight:650}.sub{font-size:11px;fill:#84947a!important}.port{fill:#8eaa7a}.port-label{font-size:9px;fill:#829578}.label{font-size:10px;fill:#7b8e71}.section{font-size:11px;letter-spacing:2px;font-weight:600;fill:#889d7d}.tag{font-size:10px;font-weight:700;fill:#65835a!important}.packet{fill:#6b9c56}.caption{font-size:15px;fill:#4e7144}.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:#758a69}.legend i{display:inline-block;width:8px;height:8px;background:#85ac68;border-radius:50%;margin-right:7px}.legend span:last-child i{background:#b89d78}#step{font-size:12px;color:#69855e}.paused *{animation-play-state:paused}@media(max-width:600px){body{padding:15px}h1{font-size:23px}}
</style></head><body><main><header><div><h1>One conversation. Six connected entities.</h1><p>Audio stays on the computer. Finalized text travels to Ollama Cloud.</p></div><button id="toggle">Pause animation</button></header>
<svg viewBox="0 0 1400 610" role="img" aria-label="Animated voice pipeline, with input/output arrows and an interruption return path">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#91ac80" stroke-width="1.5"/></marker></defs>
<text x="40" y="46" class="section">LOCAL CAPTURE</text><text x="470" y="46" class="section">SPEECH + CONVERSATION</text><text x="1160" y="46" class="section">LOCAL PLAYBACK</text>
<rect x="727" y="70" width="215" height="310" rx="20" fill="#f2f5ec" stroke="#d5dfca" stroke-dasharray="5 5"/>
<text x="835" y="95" text-anchor="middle" class="tag">OLLAMA CLOUD</text>
<g id="mic" class="node" transform="translate(35 160)"><rect width="175" height="125" rx="16"/><text x="20" y="28" class="tag">BROWSER</text><text x="20" y="56" class="title">Microphone</text><text x="20" y="80" class="sub">16 kHz · mono audio</text><text x="20" y="100" class="sub">Echo cancellation</text><circle cx="175" cy="62" r="4" class="port"/><text x="145" y="118" class="port-label">OUT</text></g>
<g id="vad" class="node" transform="translate(265 160)"><rect width="175" height="125" rx="16"/><text x="20" y="28" class="tag">CPU</text><text x="20" y="56" class="title">Silero VAD</text><text x="20" y="80" class="sub">Speech vs. silence</text><text x="20" y="100" class="sub">700 ms end-of-turn</text><circle cy="62" r="4" class="port"/><circle cx="175" cy="62" r="4" class="port"/><text x="9" y="118" class="port-label">IN</text><text x="145" y="118" class="port-label">OUT</text></g>
<g id="stt" class="node" transform="translate(495 160)"><rect width="175" height="125" rx="16"/><text x="20" y="28" class="tag">GPU WORKER</text><text x="20" y="56" class="title">Whisper Small</text><text x="20" y="80" class="sub">English transcription</text><text x="20" y="100" class="sub">Rolling + final decode</text><circle cy="62" r="4" class="port"/><circle cx="175" cy="62" r="4" class="port"/><text x="9" y="118" class="port-label">IN</text><text x="145" y="118" class="port-label">OUT</text></g>
<g id="llm" class="node" transform="translate(745 160)"><rect width="175" height="125" rx="16"/><text x="20" y="28" class="tag">STREAMING LLM</text><text x="20" y="56" class="title">Nemotron Nano</text><text x="20" y="80" class="sub">30B · thinking off</text><text x="20" y="100" class="sub">English conversation</text><circle cy="62" r="4" class="port"/><circle cx="175" cy="62" r="4" class="port"/><text x="9" y="118" class="port-label">IN</text><text x="145" y="118" class="port-label">OUT</text></g>
<g id="tts" class="node" transform="translate(995 160)"><rect width="175" height="125" rx="16"/><text x="20" y="28" class="tag">CPU WORKER</text><text x="20" y="56" class="title">Kokoro TTS</text><text x="20" y="80" class="sub">Short phrase synthesis</text><text x="20" y="100" class="sub">Bounded audio queue</text><circle cy="62" r="4" class="port"/><circle cx="175" cy="62" r="4" class="port"/><text x="9" y="118" class="port-label">IN</text><text x="145" y="118" class="port-label">OUT</text></g>
<g id="speaker" class="node" transform="translate(1225 160)"><rect width="145" height="125" rx="16"/><text x="16" y="28" class="tag">BROWSER</text><text x="16" y="56" class="title">Speaker</text><text x="16" y="80" class="sub">Ordered playback</text><text x="16" y="100" class="sub">Interrupt any time</text><circle cy="62" r="4" class="port"/><text x="9" y="118" class="port-label">IN</text></g>
<path id="e1" class="edge" d="M214 222H257"/><path id="e2" class="edge" d="M444 222H487"/><path id="e3" class="edge" d="M674 222H737"/><path id="e4" class="edge" d="M924 222H987"/><path id="e5" class="edge" d="M1174 222H1217"/>
<text x="238" y="202" text-anchor="middle" class="label">PCM</text><text x="467" y="202" text-anchor="middle" class="label">audio</text><text x="706" y="202" text-anchor="middle" class="label">final text</text><text x="956" y="202" text-anchor="middle" class="label">phrases</text><text x="1196" y="202" text-anchor="middle" class="label">audio</text>
<path class="edge" d="M580 290V350H355"/><text x="361" y="341" class="label">Partial transcript → live UI</text>
<path class="edge" d="M1295 290V420H833V292"/><text x="975" y="409" class="label">Completed playback → conversation history</text>
<path id="cancel" class="edge return" d="M352 290V477H1295V435"/><text x="517" y="464" class="label">New speech → cancel generation · discard queued audio · stop playback</text>
<circle class="packet" r="5"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle><circle class="packet" r="5"><animateMotion dur="1.5s" begin=".3s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle><circle class="packet" r="5"><animateMotion dur="1.5s" begin=".6s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle><circle class="packet" r="5"><animateMotion dur="1.5s" begin=".9s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle><circle class="packet" r="5"><animateMotion dur="1.5s" begin="1.2s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
<text id="caption" x="700" y="555" text-anchor="middle" class="caption">1 · Capture your voice in the browser</text><text x="700" y="583" text-anchor="middle" class="label">Illustration of the implemented flow — not a measured timing trace</text>
</svg><div class="legend"><span><i></i>Forward data flow</span><span>GPU: STT · CPU: VAD + TTS</span><span>Finalized text only leaves the computer</span><span><i></i>Interruption control</span></div><p id="step">Click an entity to inspect it. Animation runs independently of the voice server.</p></main>
<script>
const steps=[['mic','1 · Capture your voice in the browser'],['vad','2 · Detect speech, pauses, and interruptions'],['stt','3 · Show rolling previews, then finalize the transcript'],['llm','4 · Stream a concise English response from Ollama'],['tts','5 · Synthesize short phrases while the LLM continues'],['speaker','6 · Play in order and acknowledge completed phrases']];
let current=0,paused=false;const svg=document.querySelector('svg');
function step(index){current=index;document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));document.getElementById(steps[index][0]).classList.add('active');document.getElementById('caption').textContent=steps[index][1];}
setInterval(()=>{if(!paused)step((current+1)%steps.length)},1400);step(0);
document.querySelectorAll('.node').forEach((node,index)=>{node.style.cursor='pointer';node.setAttribute('tabindex','0');node.setAttribute('role','button');node.setAttribute('aria-label',steps[index][1]);node.addEventListener('click',()=>step(index));node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();step(index);}});});
document.getElementById('toggle').onclick=()=>{paused=!paused;paused?svg.pauseAnimations():svg.unpauseAnimations();document.getElementById('toggle').textContent=paused?'Resume animation':'Pause animation';};
if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('toggle').click();
</script></body></html>
